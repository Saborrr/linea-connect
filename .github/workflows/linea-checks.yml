name: Linea policy and diagnostics
on:
  push:
    branches: [main, linea]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Run dependency-free policy and privacy checks
        run: dart tool/linea_checks.dart
      - name: Check patch whitespace
        run: git diff --check
